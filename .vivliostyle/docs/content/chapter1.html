<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>かえるくんの困りごと</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../../themes/node_modules/content-style/content-style.css"
    />
  </head>
  <body>
    <section class="level2" aria-labelledby="h2_1">
      <h2 id="h2_1">かえるくんの困りごと</h2>
      <div class="ballon-div">
        <!-- ひつじさん -->
        <div class="balloon-chat balloon-chat--right">
          <div class="chatting">
            <p class="chat-text chat-text--right">
              これはChatGPTも混乱するやつだね
            </p>
          </div>
          <figure class="ballon--figture__margin">
            <img
              class="icon-img"
              src="../../images/sheep-worried.png"
              alt="ひつじさん"
            />
            <figcaption class="icon-name">ひつじさん</figcaption>
          </figure>
        </div>
        <!-- かえるくん -->
        <div class="balloon-chat balloon-chat--left">
          <figure class="ballon--figture__margin">
            <img
              class="icon-img"
              src="../../images/frog.png"
              alt="かえるくん"
            />
            <figcaption class="icon-name">かえるくん</figcaption>
          </figure>
          <div class="chatting balloon-chat__left">
            <p class="chat-text chat-text--left">どうすればいいの！？</p>
          </div>
        </div>
        <!-- ひつじさん -->
        <div class="balloon-chat balloon-chat--right">
          <div class="chatting">
            <p class="chat-text chat-text--right">
              落ち着いて。1個1個じっくり確認しよう
            </p>
          </div>
          <figure class="ballon--figture__margin">
            <img
              class="icon-img"
              src="../../images/sheep-surprise.png"
              alt="ひつじさん"
            />
            <figcaption class="icon-name">ひつじさん</figcaption>
          </figure>
        </div>
        <!-- かえるくん -->
        <div class="balloon-chat balloon-chat--left">
          <figure class="ballon--figture__margin">
            <img
              class="icon-img"
              src="../../images/frog.png"
              alt="かえるくん"
            />
            <figcaption class="icon-name">かえるくん</figcaption>
          </figure>
          <div class="chatting balloon-chat__left">
            <p class="chat-text chat-text--left">うん、わかった！</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
